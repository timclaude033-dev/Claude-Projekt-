<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walter Setting — Fahrplan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="walter-setting-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   WALTER SETTING — FAHRPLAN
   Alle Aufgaben von der Gruendung bis zum ersten Umsatz.
   Eine Datei. Der Stand liegt im Browser (localStorage).
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#16233B; --ink-soft:#21395A; --grad-1:#35577D; --grad-2:#152234;
  --text:#1C2A3F; --muted:#6E7F95; --bg:#F2F5F9; --flaeche:#FFFFFF; --flaeche-2:#F7F9FC;
  --rand:#E2E7EE; --gut:#2E7D5B; --warn:#B07A22; --schlecht:#B4483C; --info:#35577D;
  --head:'Montserrat',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --ez:cubic-bezier(.22,1,.36,1); --r:12px;
  --schatten:0 1px 2px rgba(22,35,59,.04),0 6px 20px -10px rgba(22,35,59,.13);
}
[data-theme="dark"]{
  --ink:#E8EEF6; --ink-soft:#C3D2E4; --text:#DFE8F3; --muted:#8FA3BC;
  --bg:#0D141F; --flaeche:#151E2C; --flaeche-2:#1B2536; --rand:#26334799;
  --gut:#5FBF92; --warn:#E0A94A; --schlecht:#E1786B; --info:#7FA0C4;
  --schatten:0 1px 2px rgba(0,0,0,.35),0 6px 20px -10px rgba(0,0,0,.6);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);font-size:15px;line-height:1.6;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;transition:background .25s var(--ez),color .25s var(--ez)}
h1,h2,h3{font-family:var(--head);font-weight:700;color:var(--ink);line-height:1.2}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--grad-1);outline-offset:2px;border-radius:6px}

.kopf{position:sticky;top:0;z-index:50;background:var(--flaeche);border-bottom:1px solid var(--rand)}
.kopf-in{max-width:1000px;margin:0 auto;padding:14px 20px}
.kopf-oben{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.marke{display:flex;align-items:center;gap:10px;flex:none}
.marke svg{width:28px;height:28px}
.marke b{font-family:var(--head);font-size:13px;letter-spacing:.09em;color:var(--ink);display:block}
.marke small{display:block;font-size:8.5px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.kopf-rechts{margin-left:auto;display:flex;gap:7px;align-items:center}
.ik{width:34px;height:34px;border:1px solid var(--rand);border-radius:8px;display:flex;flex:none;
  align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.ik:hover{background:var(--bg);border-color:var(--grad-1)}
.ik svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.fortschritt{display:flex;align-items:center;gap:14px}
.balken{flex:1;height:10px;background:var(--bg);border-radius:20px;overflow:hidden}
.balken i{display:block;height:100%;border-radius:20px;transition:width .7s var(--ez);
  background:linear-gradient(90deg,var(--grad-1),var(--ink))}
.fortschritt b{font-family:var(--head);font-size:1.15rem;color:var(--ink);flex:none}
.fortschritt span{font-size:13px;color:var(--muted);flex:none}

.huelle{max-width:1000px;margin:0 auto;padding:20px 20px 90px}
.naechste{background:linear-gradient(150deg,var(--grad-1),var(--grad-2));color:#fff;border-radius:var(--r);
  padding:18px 20px;margin-bottom:20px;box-shadow:var(--schatten)}
.naechste .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.naechste h2{color:#fff;font-size:1.15rem;margin:5px 0 5px}
.naechste p{font-size:14px;opacity:.82}
.naechste .wo{display:inline-block;margin-top:9px;font-size:13px;background:rgba(255,255,255,.14);
  padding:4px 10px;border-radius:20px}

.leiste{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.fbtn{padding:6px 13px;border:1px solid var(--rand);border-radius:20px;font-size:13.5px;
  color:var(--muted);background:var(--flaeche);transition:all .15s}
.fbtn:hover{border-color:var(--grad-1);color:var(--ink)}
.fbtn.on{background:var(--ink);color:var(--flaeche);border-color:var(--ink);font-weight:600}
[data-theme="dark"] .fbtn.on{color:#0D141F}

.phase{margin-bottom:22px}
.phase-kopf{display:flex;align-items:center;gap:12px;margin-bottom:11px;cursor:pointer;
  padding:11px 14px;background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--r)}
.phase-kopf .nr{width:32px;height:32px;flex:none;border-radius:9px;background:var(--ink);color:var(--flaeche);
  display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:13px}
[data-theme="dark"] .phase-kopf .nr{color:#0D141F}
.phase.fertig .phase-kopf .nr{background:var(--gut)}
.phase-kopf h2{font-size:1.05rem;flex:1;min-width:0}
.phase-kopf .zeit{font-size:12.5px;color:var(--muted);flex:none}
.phase-kopf .stand{font-size:12.5px;font-weight:600;color:var(--muted);flex:none;
  background:var(--bg);padding:3px 10px;border-radius:20px}
.phase.fertig .phase-kopf .stand{background:rgba(46,125,91,.14);color:var(--gut)}
.phase-kopf .pfeil{width:14px;height:14px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.4;
  transition:transform .25s var(--ez)}
.phase.zu .phase-kopf .pfeil{transform:rotate(-90deg)}
.phase.zu .aufgaben{display:none}
.aufgaben{display:grid;gap:8px;padding-left:14px}

.aufgabe{background:var(--flaeche);border:1px solid var(--rand);border-radius:10px;padding:13px 15px;
  display:flex;gap:13px;align-items:flex-start;transition:border-color .15s,opacity .2s}
.aufgabe:hover{border-color:var(--grad-1)}
.aufgabe.ab{opacity:.55}
.aufgabe.ab .titel{text-decoration:line-through;color:var(--muted)}
.hk{width:22px;height:22px;flex:none;margin-top:1px;border:1.8px solid var(--rand);border-radius:6px;
  display:flex;align-items:center;justify-content:center;transition:all .18s var(--ez);background:var(--flaeche)}
.hk:hover{border-color:var(--grad-1)}
.aufgabe.ab .hk{background:var(--gut);border-color:var(--gut)}
.hk svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s var(--ez)}
.aufgabe.ab .hk svg{stroke-dashoffset:0}
.inhalt{flex:1;min-width:0}
.titel{font-weight:600;color:var(--ink);font-size:14.5px}
.was{font-size:13.5px;color:var(--muted);margin-top:3px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--muted)}
.tag.wo{background:rgba(53,87,125,.12);color:var(--info)}
.tag.geld{background:rgba(176,122,34,.13);color:var(--warn)}
.tag.pflicht{background:rgba(180,72,60,.12);color:var(--schlecht)}
.tag a{color:inherit;text-decoration:underline}
.warn{display:flex;gap:9px;margin-top:9px;padding:10px 12px;border-radius:8px;font-size:13px;
  background:rgba(176,122,34,.10);border:1px solid rgba(176,122,34,.28)}
.warn b{color:var(--warn)}
.notiz{width:100%;margin-top:9px;padding:7px 10px;border:1px solid var(--rand);border-radius:7px;
  font-size:13px;background:var(--flaeche-2);resize:vertical;min-height:34px;display:none}
.notiz.auf{display:block}
.nbtn{font-size:11.5px;color:var(--muted);padding:2px 8px;border-radius:20px;background:var(--bg)}
.nbtn:hover{color:var(--ink)}
.datum{font-size:11.5px;color:var(--gut);font-weight:600}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(140%);z-index:90;
  background:var(--ink);color:var(--flaeche);padding:10px 18px;border-radius:9px;font-size:13.5px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .3s var(--ez)}
[data-theme="dark"] .toast{color:#0D141F}
.toast.auf{transform:translateX(-50%) translateY(0)}
.fertig-alles{text-align:center;padding:30px;background:var(--flaeche);border:1px solid var(--rand);
  border-radius:var(--r);margin-bottom:20px}
.fertig-alles h2{color:var(--gut);margin-bottom:6px}

@media(max-width:640px){
  .huelle{padding:16px 13px 80px}
  .kopf-in{padding:12px 13px}
  .aufgaben{padding-left:0}
  .phase-kopf .zeit{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
@media print{
  .kopf-rechts,.leiste,.nbtn,.naechste{display:none}
  .aufgabe,.phase-kopf{break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-in">
    <div class="kopf-oben">
      <div class="marke">
        <svg viewBox="60 40 430 400" aria-hidden="true"><polyline points="95,80 195,400 278,210 360,400 455,80"
          fill="none" stroke="#35577D" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><b>WALTER SETTING</b><small>Fahrplan bis zum ersten Umsatz</small></span>
      </div>
      <div class="kopf-rechts">
        <button class="ik" id="btnThema" title="Hell / Dunkel" aria-label="Darstellung wechseln">
          <svg id="icoThema" viewBox="0 0 24 24"></svg></button>
        <button class="ik" id="btnDruck" title="Drucken" aria-label="Drucken">
          <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 15h12v6H6z"/></svg></button>
        <button class="ik" id="btnReset" title="Alles zurücksetzen" aria-label="Zurücksetzen">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
    </div>
    <div class="fortschritt">
      <b id="prozent">0 %</b>
      <span class="balken"><i id="balken" style="width:0%"></i></span>
      <span id="stand">0 von 0 erledigt</span>
    </div>
  </div>
</header>

<div class="huelle">
  <div id="naechsteBox"></div>
  <div class="leiste">
    <button class="fbtn on" data-f="alle">Alle</button>
    <button class="fbtn" data-f="offen">Nur offene</button>
    <button class="fbtn" data-f="fertig">Nur erledigte</button>
    <button class="fbtn" data-f="pflicht">Nur Pflicht</button>
    <button class="fbtn" id="btnAlleZu" style="margin-left:auto">Alle einklappen</button>
  </div>
  <div id="liste"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   DIE AUFGABEN
   fertig: true  = bereits erledigt (Stand bei der Erstellung)
   pflicht: true = rechtlich oder sachlich unverzichtbar
   ═══════════════════════════════════════════════════════════════ */
const PHASEN = [
{ nr:'✓', name:'Bereits erledigt', zeit:'', aufgaben:[
  {id:'x1',t:'Angebot, Zielgruppe und Marke stehen',fertig:true,
   was:'Terminvereinbarung für kleine Maklerbüros. 100 € je Verkäufer-Termin, 50 € je Käufer-Termin, 5 % der Maklerprovision bei Abschluss, die ersten drei Termine kostenlos.',wo:'—'},
  {id:'x2',t:'Webseite ist online',fertig:true,
   was:'Mit Impressum und Datenschutzerklärung. Jede Änderung wird automatisch veröffentlicht.',
   wo:'timclaude033-dev.github.io/Claude-Projekt-/',link:'https://timclaude033-dev.github.io/Claude-Projekt-/'},
  {id:'x3',t:'CRM ist einsatzbereit',fertig:true,
   was:'Radar mit Karte, Pipeline, Büroliste, Mailvorlagen, Telefonleitfaden und Ziel-Rechnung.',
   wo:'setting-crm.html',link:'setting-crm.html'},
]},

{ nr:'1', name:'Anmelden', zeit:'2 Stunden · ~50 €', aufgaben:[
  {id:'p1',t:'Gewerbe anmelden',pflicht:true,recht:'§ 14 GewO',
   was:'Als Tätigkeit eintragen: „Telefonische Terminvereinbarung und Vertriebsunterstützung für Immobilienunternehmen“.',
   wo:'Gewerbeamt Ihrer Stadt, meist online',geld:'20–60 €',
   warn:'Keine Formulierung mit „Vermittlung von Immobilien“ — das wäre erlaubnispflichtig nach § 34c GewO und zwingt Sie in ein Genehmigungsverfahren. Sie vereinbaren Termine, Sie vermitteln nicht.'},
  {id:'p2',t:'Steuerlich erfassen lassen',pflicht:true,recht:'§ 138 AO',
   was:'Fragebogen über ELSTER ausfüllen. Darin gleich die USt-IdNr. mitbeantragen und Regelbesteuerung statt Kleinunternehmerregelung wählen — Ihre Kunden ziehen die Umsatzsteuer als Vorsteuer ab, für sie ändert sich also nichts, und Sie müssen nicht mitten im ersten guten Jahr umstellen.',
   wo:'elster.de',link:'https://www.elster.de'},
]},

{ nr:'2', name:'Rechtlich sauber werden', zeit:'1 Tag', aufgaben:[
  {id:'p3',t:'Impressum vervollständigen',pflicht:true,recht:'§ 5 DDG',
   was:'Straße, PLZ und Ort, Telefonnummer sowie Steuernummer oder USt-IdNr. eintragen.',
   wo:'impressum.html',
   warn:'Solange dort Platzhalter stehen, ist die Seite abmahnfähig. Das muss erledigt sein, bevor der erste Makler sie öffnet.'},
  {id:'p4',t:'Auftragsverarbeitung regeln',pflicht:true,recht:'Art. 28 und 30 DSGVO',
   was:'AVV-Muster der IHK übernehmen und dazu ein Verzeichnis der Verarbeitungstätigkeiten anlegen — eine Tabelle genügt: welche Daten, wozu, woher, wie lange, wie geschützt.',
   wo:'IHK-Muster, kostenlos',
   warn:'Der AVV muss unterschrieben sein, bevor der erste Kontakt eines Maklers bei Ihnen ankommt.'},
  {id:'p5',t:'Einwilligung der Eigentümer sicherstellen',pflicht:true,recht:'§ 7 UWG',
   was:'Lassen Sie sich pro Übergabe schriftlich bestätigen, woher die Kontakte stammen und dass eine Einwilligung zur telefonischen Kontaktaufnahme vorliegt. Ein Satz im Vertrag plus eine Spalte in der Übergabeliste reicht.',
   wo:'Vertrag und Übergabeliste',
   warn:'Der wichtigste Punkt überhaupt. Maklerbüros dürfen Sie als Unternehmen anrufen. Die Eigentümer, die Sie für sie anrufen, sind Privatpersonen — dort sind Werbeanrufe ohne ausdrückliche vorherige Einwilligung unzulässig, bis 300.000 € Bußgeld, und es trifft im Zweifel beide Seiten. Sauber ist es, wenn der Eigentümer selbst angefragt hat. Riskant sind alte Bestandslisten.'},
]},

{ nr:'3', name:'Verkaufsbereit werden', zeit:'halber Tag', aufgaben:[
  {id:'p6',t:'Einseitigen Vertrag aufsetzen',
   was:'Leistung, Preise, drei Gratis-Termine, Definition des qualifizierten Termins, Nachweisregel mit Sieben-Tage-Frist, Kündigung jederzeit — und wie lange nach einem Termin ein Abschluss noch als Ihrer gilt. Üblich sind 6 bis 12 Monate.',
   wo:'Textprogramm',
   warn:'Ohne diese Nachlauffrist streiten Sie sich über jeden Abschluss, der Monate später zustande kommt.'},
  {id:'p7',t:'Geschäftlich erreichbar sein',
   was:'Eigene Telefonnummer und eine E-Mail unter Ihrer Domain, beides getrennt vom Privaten. Danach im CRM unter Absender und auf der Webseite eintragen.',
   wo:'Mobilfunk- und Domainanbieter',geld:'ca. 20 € im Monat'},
  {id:'p8',t:'Übergabeformat festlegen',
   was:'Eine Tabelle mit Name, Telefon, Objekt, Quelle des Kontakts und Datum der Einwilligung. Dieses Format geben Sie vor — passen Sie sich nicht jedem Makler einzeln an.',
   wo:'Tabellenprogramm'},
]},

{ nr:'4', name:'Kunden gewinnen', zeit:'Woche 2–4', aufgaben:[
  {id:'p9',t:'50 Maklerbüros im CRM sammeln',
   was:'Radar über Ihre Region laufen lassen, den Rest über Portale und die örtliche Suche ergänzen. Ziel sind 50 Einträge mit Namen des Inhabers und Telefonnummer.',
   wo:'CRM, Radar und Büro anlegen'},
  {id:'p10',t:'Täglich 20 Anrufe führen',
   was:'Jeden Werktag, feste Blöcke im Kalender. Jedes Ergebnis samt Wiedervorlage sofort im CRM festhalten. Die Formulierung verbessert sich beim Telefonieren, nicht am Schreibtisch.',
   wo:'CRM, Heute'},
  {id:'p11',t:'Erstgespräche führen',
   was:'20 Minuten. Zwei Fragen entscheiden: Wie viele Anfragen kommen im Monat, und wie viele davon werden zurückgerufen? Aus etwa 50 Anrufen werden erfahrungsgemäß vier bis sechs Gespräche.',
   wo:'Telefon'},
]},

{ nr:'5', name:'Erster Kunde', zeit:'Woche 3–5', aufgaben:[
  {id:'p12',t:'Vertrag und AVV unterschreiben lassen',pflicht:true,recht:'Art. 28 DSGVO',
   was:'Beides vor der ersten Kontaktübergabe. Dabei die Herkunft der Kontakte prüfen — nur annehmen, was nachvollziehbar eingewilligt hat.',
   wo:'per E-Mail'},
  {id:'p13',t:'Drei Gratis-Termine liefern',
   was:'Das ist der eigentliche Verkauf. Zu jedem Termin das Protokoll mitgeben: Eigentum, Verkaufsabsicht, Anlass, Zeitrahmen, Preisvorstellung, Nutzung, Wettbewerb, Entscheider.',
   wo:'Telefon und Kalender',
   warn:'Starten Sie nur ein bis zwei Neukunden im Monat. Jeder kostet Sie drei kostenlose Termine, und Sie führen die Gespräche selbst.'},
]},

{ nr:'6', name:'Erster Umsatz', zeit:'Woche 4–6', aufgaben:[
  {id:'p14',t:'Ab dem vierten Termin abrechnen',pflicht:true,recht:'§ 14 UStG',
   was:'Pflichtangaben der Rechnung: Ihr Name und Anschrift, Steuernummer oder USt-IdNr., fortlaufende Rechnungsnummer, Datum, Leistung und Zeitraum, Netto, 19 % Umsatzsteuer, Brutto. Zahlungsziel 14 Tage.',
   wo:'Rechnungsvorlage'},
  {id:'p15',t:'Umsatzsteuer anmelden und abführen',pflicht:true,recht:'§ 18 UStG',
   was:'Im ersten Jahr meist monatlich über ELSTER. Legen Sie die Umsatzsteuer bei jedem Zahlungseingang sofort beiseite — sie gehört Ihnen nie.',
   wo:'elster.de',link:'https://www.elster.de'},
]},
];

const KEY = 'wsFahrplan';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function sicher(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function grund(){
  const st = {};
  PHASEN.forEach(p => p.aufgaben.forEach(a => {
    st[a.id] = { ab: !!a.fertig, seit: a.fertig ? 'vorab' : null, notiz: '' };
  }));
  return { stand:st, thema:'light', zu:[], filter:'alle' };
}
function laden(){
  try{
    const roh = localStorage.getItem(KEY);
    if(!roh) return grund();
    const d = JSON.parse(roh), g = grund();
    /* Neue Aufgaben ergaenzen, ohne den bisherigen Stand zu verlieren */
    Object.keys(g.stand).forEach(id => { if(d.stand && d.stand[id]) g.stand[id] = d.stand[id]; });
    return { ...g, ...d, stand:g.stand };
  }catch(e){ return grund(); }
}
let D = laden();
function sichern(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }

let toastZeit;
function melde(t){ const el=$('#toast'); el.textContent=t; el.classList.add('auf');
  clearTimeout(toastZeit); toastZeit=setTimeout(()=>el.classList.remove('auf'),2200); }

function alleAufgaben(){ return PHASEN.flatMap(p => p.aufgaben.map(a => ({...a, phase:p}))); }
function offeneAufgaben(){ return alleAufgaben().filter(a => !D.stand[a.id].ab); }

function bauen(){
  const alle = alleAufgaben();
  const fertig = alle.filter(a => D.stand[a.id].ab).length;
  const anteil = Math.round(fertig / alle.length * 100);
  $('#prozent').textContent = anteil + ' %';
  $('#balken').style.width = anteil + '%';
  $('#stand').textContent = fertig + ' von ' + alle.length + ' erledigt';

  /* Nächster offener Schritt */
  const naechste = offeneAufgaben()[0];
  $('#naechsteBox').innerHTML = naechste
    ? `<div class="naechste"><div class="lbl">Ihr nächster Schritt</div>
        <h2>${sicher(naechste.t)}</h2><p>${sicher(naechste.was)}</p>
        ${naechste.wo && naechste.wo!=='—' ? `<span class="wo">Wo: ${sicher(naechste.wo)}</span>` : ''}</div>`
    : `<div class="fertig-alles"><h2>Alles erledigt.</h2>
        <p>Von der Gründung bis zum ersten Umsatz ist jeder Punkt abgehakt.</p></div>`;

  $('#liste').innerHTML = PHASEN.map(p => {
    const auf = p.aufgaben.filter(a => {
      if(D.filter==='offen')   return !D.stand[a.id].ab;
      if(D.filter==='fertig')  return D.stand[a.id].ab;
      if(D.filter==='pflicht') return !!a.pflicht;
      return true;
    });
    if(!auf.length) return '';
    const f = p.aufgaben.filter(a => D.stand[a.id].ab).length;
    const komplett = f === p.aufgaben.length;
    const zu = D.zu.includes(p.nr);
    return `<div class="phase ${komplett?'fertig':''} ${zu?'zu':''}" data-p="${p.nr}">
      <div class="phase-kopf" role="button" tabindex="0">
        <span class="nr">${komplett?'✓':p.nr}</span>
        <h2>${sicher(p.name)}</h2>
        <span class="zeit">${sicher(p.zeit)}</span>
        <span class="stand">${f}/${p.aufgaben.length}</span>
        <svg class="pfeil" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="aufgaben">${auf.map(a => karte(a)).join('')}</div>
    </div>`;
  }).join('');

  $$('.phase-kopf').forEach(k => {
    const p = k.closest('.phase').dataset.p;
    const um = () => { D.zu = D.zu.includes(p) ? D.zu.filter(x=>x!==p) : D.zu.concat(p);
      sichern(); bauen(); };
    k.onclick = um;
    k.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); um(); } };
  });
  $$('[data-hk]').forEach(el => el.onclick = e => { e.stopPropagation(); umschalten(el.dataset.hk); });
  $$('[data-n]').forEach(el => el.onclick = e => { e.stopPropagation();
    const t = $('#n-'+el.dataset.n); t.classList.toggle('auf'); if(t.classList.contains('auf')) t.focus(); });
  $$('.notiz').forEach(t => t.oninput = () => { D.stand[t.dataset.id].notiz = t.value; sichern(); });
}

function karte(a){
  const s = D.stand[a.id];
  return `<div class="aufgabe ${s.ab?'ab':''}">
    <button class="hk" data-hk="${a.id}" aria-label="${s.ab?'Als offen markieren':'Als erledigt markieren'}">
      <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></button>
    <div class="inhalt">
      <div class="titel">${sicher(a.t)}</div>
      <div class="was">${sicher(a.was)}</div>
      <div class="meta">
        ${a.wo && a.wo!=='—' ? (a.link
           ? `<span class="tag wo">Wo: <a href="${sicher(a.link)}" target="_blank" rel="noopener">${sicher(a.wo)}</a></span>`
           : `<span class="tag wo">Wo: ${sicher(a.wo)}</span>`) : ''}
        ${a.geld ? `<span class="tag geld">${sicher(a.geld)}</span>` : ''}
        ${a.pflicht ? `<span class="tag pflicht">Pflicht${a.recht?' · '+sicher(a.recht):''}</span>` : ''}
        ${s.ab && s.seit && s.seit!=='vorab' ? `<span class="datum">erledigt ${sicher(s.seit)}</span>` : ''}
        ${s.ab && s.seit==='vorab' ? '<span class="datum">bereits erledigt</span>' : ''}
        <button class="nbtn" data-n="${a.id}">Notiz</button>
      </div>
      ${a.warn ? `<div class="warn"><div><b>Achtung.</b> ${sicher(a.warn)}</div></div>` : ''}
      <textarea class="notiz ${s.notiz?'auf':''}" id="n-${a.id}" data-id="${a.id}"
        placeholder="Notiz, Ansprechpartner, Frist …">${sicher(s.notiz)}</textarea>
    </div></div>`;
}

function umschalten(id){
  const s = D.stand[id];
  s.ab = !s.ab;
  s.seit = s.ab ? new Date().toLocaleDateString('de-DE') : null;
  sichern(); bauen();
  const offen = offeneAufgaben().length;
  melde(s.ab ? (offen ? 'Erledigt. Noch ' + offen + ' offen.' : 'Alles erledigt.') : 'Wieder offen.');
}

function themaSetzen(t){
  D.thema = t; document.documentElement.dataset.theme = t; sichern();
  $('#icoThema').innerHTML = t==='dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}

$$('.fbtn[data-f]').forEach(b => b.onclick = () => {
  D.filter = b.dataset.f; sichern();
  $$('.fbtn[data-f]').forEach(x => x.classList.toggle('on', x===b));
  bauen();
});
$('#btnAlleZu').onclick = () => {
  D.zu = D.zu.length ? [] : PHASEN.map(p => p.nr);
  $('#btnAlleZu').textContent = D.zu.length ? 'Alle aufklappen' : 'Alle einklappen';
  sichern(); bauen();
};
$('#btnThema').onclick = () => themaSetzen(D.thema==='dark' ? 'light' : 'dark');
$('#btnDruck').onclick = () => print();
$('#btnReset').onclick = () => {
  if(!confirm('Alle Haken zurücksetzen? Notizen gehen dabei ebenfalls verloren.')) return;
  D = grund(); sichern(); themaSetzen(D.thema); bauen(); melde('Zurückgesetzt.');
};

themaSetzen(D.thema || 'light');
$$('.fbtn[data-f]').forEach(x => x.classList.toggle('on', x.dataset.f === D.filter));
bauen();
</script>
</body>
</html>
