# Veroeffentlicht den Inhalt von main auf GitHub Pages.
# Damit ist die Ausgabe eindeutig: was auf main liegt, steht auf der Seite.
name: Seite veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:      # erlaubt das Veroeffentlichen von Hand

permissions:
  contents: read
  pages: write
  id-token: write

# Ein neuer Lauf loest den alten ab. Vorher stand hier false -- dann
# stellt sich jeder neue Lauf hinter einen haengenden und startet nie.
# Die Veroeffentlichung selbst ist atomar: erst wird hochgeladen, dann
# umgeschaltet. Ein Abbruch kann also keine halbe Seite hinterlassen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
