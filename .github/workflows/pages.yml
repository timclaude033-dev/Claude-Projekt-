# Veroeffentlicht den Inhalt von main auf GitHub Pages.
# Damit ist die Ausgabe eindeutig: was auf main liegt, steht auf der Seite.
name: Seite veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:      # erlaubt das Veroeffentlichen von Hand

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veroeffentlichungen nicht abbrechen, sonst geht eine halb
# hochgeladene Seite live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
