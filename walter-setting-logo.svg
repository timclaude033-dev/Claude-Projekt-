<svg viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Walter Setting – Qualifizierte Termine für Makler">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');
      .wm { font-family: 'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <linearGradient id="wgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35577D"/>
      <stop offset="1" stop-color="#152234"/>
    </linearGradient>
  </defs>

  <!-- W mark (same style as Walter Workflows) -->
  <polyline points="95,80 195,400 278,210 360,400 455,80"
            fill="none" stroke="url(#wgrad)" stroke-width="80"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark, stacked uppercase -->
  <text class="wm" x="560" y="205" font-size="96" font-weight="700"
        letter-spacing="6" fill="#21395A">WALTER</text>
  <text class="wm" x="560" y="320" font-size="96" font-weight="700"
        letter-spacing="6" fill="#21395A">SETTING</text>

  <!-- Tagline -->
  <text class="wm" x="562" y="378" font-size="33" font-weight="600"
        letter-spacing="11" fill="#6E7F95">QUALIFIZIERTE TERMINE FÜR MAKLER</text>
</svg>
